<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音合同生成</title>
<style>
  :root {
    --blue:   #1677ff;
    --green:  #52c41a;
    --red:    #ff4d4f;
    --orange: #fa8c16;
    --gray:   #8c8c8c;
    --bg:     #f5f5f5;
    --card:   #ffffff;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
         background: var(--bg); color: #262626; min-height: 100dvh; }

  /* ── 顶部 ── */
  .topbar { background: var(--blue); color: #fff; padding: 14px 16px 10px;
            position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 17px; font-weight: 600; }
  .progress-wrap { margin-top: 8px; background: rgba(255,255,255,.3);
                   border-radius: 4px; height: 4px; overflow: hidden; }
  .progress-bar  { height: 100%; background: #fff; transition: width .3s; border-radius: 4px; }
  .step-label { font-size: 12px; margin-top: 4px; opacity: .85; }

  /* ── 卡片 ── */
  .card { background: var(--card); border-radius: var(--radius);
          margin: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* ── 录音页 ── */
  .field-label { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .field-hint  { font-size: 13px; color: var(--gray); margin-bottom: 16px; line-height: 1.5; }
  .phase-badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
                 font-size: 12px; font-weight: 500; margin-bottom: 12px; }
  .badge-header { background: #e6f4ff; color: var(--blue); }
  .badge-item   { background: #fff7e6; color: var(--orange); }

  .tts-btn { background: none; border: none; color: var(--blue);
             font-size: 13px; cursor: pointer; margin-bottom: 12px;
             display: flex; align-items: center; gap: 4px; }

  .rec-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .rec-btn  { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer;
              font-size: 32px; display: flex; align-items: center; justify-content: center;
              background: var(--blue); box-shadow: 0 4px 12px rgba(22,119,255,.4);
              transition: transform .15s; }
  .rec-btn.recording { background: var(--red); box-shadow: 0 4px 16px rgba(255,77,79,.5);
                        animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .rec-status { font-size: 13px; color: var(--gray); }
  .rec-status.active { color: var(--red); font-weight: 500; }

  .result-box { width: 100%; margin-top: 14px; }
  .result-box label { font-size: 13px; color: var(--gray); display: block; margin-bottom: 6px; }
  .result-box input { width: 100%; border: 1px solid #d9d9d9; border-radius: 8px;
                       padding: 10px 12px; font-size: 15px; outline: none; transition: border-color .2s; }
  .result-box input:focus { border-color: var(--blue); }

  /* ── 候选词 ── */
  .suggest-wrap  { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .suggest-label { font-size: 12px; color: var(--gray); width: 100%; }
  .suggest-chip  { padding: 4px 12px; border-radius: 20px; background: #e6f4ff;
                   border: 1px solid #91caff; color: var(--blue); font-size: 13px; cursor: pointer; }
  .suggest-chip:active { background: #bae0ff; }

  /* ── 按钮 ── */
  .nav-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 13px; border: none; border-radius: 10px;
         font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
  .btn:active { opacity: .75; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-ghost   { background: #f0f0f0; color: #595959; }
  .btn-orange  { background: var(--orange); color: #fff; }

  /* ── 货物列表页 ── */
  .item-card { background: #fafafa; border: 1px solid #f0f0f0; border-radius: 10px;
               padding: 12px 14px; margin-bottom: 10px; position: relative; }
  .item-card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; padding-right: 48px; }
  .item-card-detail { font-size: 12px; color: var(--gray); line-height: 1.6; }
  .item-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px; }

  /* ── 汇总页 ── */
  .summary-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  .section-label { font-size: 12px; color: var(--gray); font-weight: 600;
                   text-transform: uppercase; margin: 16px 0 8px; letter-spacing: .5px; }
  .field-row { display: flex; justify-content: space-between; align-items: flex-start;
               padding: 9px 0; border-bottom: 1px solid #f5f5f5; }
  .field-row:last-child { border-bottom: none; }
  .field-row .key   { font-size: 13px; color: var(--gray); flex-shrink: 0; width: 88px; }
  .field-row .value { font-size: 14px; color: #262626; text-align: right; flex: 1; word-break: break-all; }
  .field-row .edit-link { font-size: 12px; color: var(--blue); margin-left: 8px; flex-shrink: 0; cursor: pointer; }

  /* ── 成功页 ── */
  .success-wrap { text-align: center; padding: 48px 16px 32px; }
  .success-icon  { font-size: 64px; margin-bottom: 16px; }
  .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .success-sub   { font-size: 14px; color: var(--gray); margin-bottom: 28px; }

  /* ── Loading ── */
  .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                      display: flex; flex-direction: column; align-items: center;
                      justify-content: center; z-index: 100; gap: 14px; color: #fff; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,.3);
             border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 顶部进度条 -->
<div class="topbar">
  <h1>语音采购合同</h1>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="step-label" id="stepLabel">加载中…</div>
</div>

<!-- ── 录音页（甲方信息 + 每条货物字段共用）── -->
<div id="pageRecord" class="hidden">
  <div class="card">
    <div id="phaseBadge" class="phase-badge badge-header">甲方信息</div>
    <div class="field-label" id="fieldLabel"></div>
    <div class="field-hint"  id="fieldHint"></div>
    <button class="tts-btn" onclick="speakHint()">🔊 朗读提示</button>

    <div class="rec-area">
      <button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
      <div class="rec-status" id="recStatus">点击麦克风开始录音</div>
    </div>

    <div class="result-box">
      <div id="suggestions" class="suggest-wrap hidden"></div>
      <label>识别结果（可手动修改）</label>
      <input type="text" id="resultInput" placeholder="录音后自动填入…">
    </div>
  </div>
  <div style="margin: 0 16px;">
    <div class="nav-row">
      <button class="btn btn-ghost"   id="prevBtn" onclick="goPrev()">← 上一项</button>
      <button class="btn btn-primary" id="nextBtn" onclick="goNext()">下一项 →</button>
    </div>
  </div>
</div>

<!-- ── 货物清单页（每录完一条显示）── -->
<div id="pageItemList" class="hidden">
  <div class="card">
    <div class="summary-title">货物清单</div>
    <div id="itemListDisplay"></div>
  </div>
  <div style="margin: 0 16px 24px;">
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="editLastItem()">修改最后一条</button>
      <button class="btn btn-orange" onclick="startNewItem()">+ 添加商品</button>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="goToSummary()">
      完成，确认所有信息 →
    </button>
  </div>
</div>

<!-- ── 汇总确认页 ── -->
<div id="pageSummary" class="hidden">
  <div class="card">
    <div class="summary-title">确认合同信息</div>
    <div class="section-label">甲方信息</div>
    <div id="summaryHeader"></div>
    <div class="section-label">货物清单</div>
    <div id="summaryItems"></div>
  </div>
  <div style="margin: 0 16px 24px;">
    <button class="btn btn-primary" style="width:100%;font-size:16px;" onclick="doGenerate()">
      生成合同并下载
    </button>
  </div>
</div>

<!-- ── 成功页 ── -->
<div id="pageSuccess" class="hidden">
  <div class="success-wrap">
    <div class="success-icon">✅</div>
    <div class="success-title">合同已生成</div>
    <div class="success-sub" id="successFilename"></div>
    <button id="downloadBtn" class="btn btn-primary"
            style="width:100%;margin-bottom:12px;" onclick="triggerDownload()">
      点击下载合同
    </button>
    <button class="btn btn-ghost" style="width:100%;" onclick="restart()">重新录入</button>
    <div id="debugInfo" style="margin-top:16px;padding:12px;background:#f5f5f5;border-radius:8px;text-align:left;font-size:12px;color:#595959;word-break:break-all;line-height:1.8;"></div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div id="loadingText">识别中…</div>
</div>

<script>
const API = '';

// ── 字段定义 ──────────────────────────────────────────────────────────
let HEADER_FIELDS = [
  { key: '甲方名称',   label: '甲方公司名称', hint: '请说出对方公司全称，例如：北京星辰科技有限公司' },
  { key: '甲方联系人', label: '甲方联系人',   hint: '请说出对方联系人姓名，例如：张伟' },
  { key: '甲方电话',   label: '甲方联系电话', hint: '请逐字说出电话号码，例如：一三八零零一三八零零零' },
];
let ITEM_FIELDS = [
  { key: '货物品类', label: '货物品类',       hint: '请说出设备类型，例如：笔记本电脑、服务器' },
  { key: '货物品牌', label: '货物品牌',       hint: '请说出品牌名称，例如：联想、戴尔、华为' },
  { key: '货物型号', label: '货物型号',       hint: '请说出具体型号，例如：ThinkPad X1 Carbon Gen12' },
  { key: '货物规格', label: '货物规格配置',   hint: '请说出主要配置，例如：十六G内存 五百一十二G固态' },
  { key: '数量',     label: '采购数量',       hint: '请说出数量和单位，例如：五十台' },
  { key: '单价',     label: '单价（元）',     hint: '请说出单件价格，例如：九千八百元。不知道可直接点下一项跳过' },
];

// ── 状态 ──────────────────────────────────────────────────────────────
let phase        = 'header';   // 'header' | 'item'
let fieldIndex   = 0;
let fromSummary  = false;
let editingItem  = -1;         // -1 = 新增，>=0 = 编辑第N条

let headerAnswers  = {};
let itemList       = [];       // 已完成的货物列表
let currentItem    = {};       // 正在录入的货物

let lastBlob     = null;
let lastFilename = '';

let mediaRec    = null;
let audioChunks = [];
let isRecording = false;

// ── 初始化 ────────────────────────────────────────────────────────────
function init() {
  fetch(API + '/fields').then(r => r.json()).then(data => {
    if (data.header_fields) HEADER_FIELDS = data.header_fields;
    if (data.item_fields)   ITEM_FIELDS   = data.item_fields;
  }).catch(() => {}).finally(() => startHeader());
}

// ── 阶段：甲方信息 ────────────────────────────────────────────────────
function startHeader() {
  phase      = 'header';
  fieldIndex = 0;
  renderField();
}

function startNewItem() {
  phase       = 'item';
  fieldIndex  = 0;
  editingItem = -1;
  currentItem = {};
  renderField();
}

function editLastItem() {
  if (itemList.length === 0) return;
  editingItem = itemList.length - 1;
  currentItem = { ...itemList[editingItem] };
  phase       = 'item';
  fieldIndex  = 0;
  renderField();
}

// ── 渲染字段 ──────────────────────────────────────────────────────────
function currentFields() {
  return phase === 'header' ? HEADER_FIELDS : ITEM_FIELDS;
}

function renderField() {
  const fields = currentFields();
  const f      = fields[fieldIndex];
  const total  = HEADER_FIELDS.length + (itemList.length + 1) * ITEM_FIELDS.length;
  const done   = (phase === 'header' ? 0 : HEADER_FIELDS.length) + fieldIndex;

  document.getElementById('progressBar').style.width = `${(done / total) * 100}%`;

  if (phase === 'header') {
    document.getElementById('stepLabel').textContent =
      `甲方信息  ${fieldIndex + 1} / ${HEADER_FIELDS.length}`;
    document.getElementById('phaseBadge').textContent = '甲方信息';
    document.getElementById('phaseBadge').className   = 'phase-badge badge-header';
  } else {
    const itemNo = editingItem >= 0 ? editingItem + 1 : itemList.length + 1;
    document.getElementById('stepLabel').textContent =
      `第 ${itemNo} 条货物  ${fieldIndex + 1} / ${ITEM_FIELDS.length}`;
    document.getElementById('phaseBadge').textContent = `第 ${itemNo} 条货物`;
    document.getElementById('phaseBadge').className   = 'phase-badge badge-item';
  }

  document.getElementById('fieldLabel').textContent = f.label;
  document.getElementById('fieldHint').textContent  = f.hint;

  const existing = phase === 'header' ? headerAnswers[f.key] : currentItem[f.key];
  document.getElementById('resultInput').value = existing || '';
  document.getElementById('recStatus').textContent = '点击麦克风开始录音';
  document.getElementById('recStatus').className   = 'rec-status';
  document.getElementById('recBtn').className      = 'rec-btn';
  document.getElementById('recBtn').textContent    = '🎤';
  document.getElementById('suggestions').classList.add('hidden');

  const isLast = fieldIndex === currentFields().length - 1;
  if (fromSummary) {
    document.getElementById('nextBtn').textContent = '保存并返回 →';
  } else {
    document.getElementById('nextBtn').textContent = isLast
      ? (phase === 'header' ? '开始录货物 →' : '完成此条货物 →')
      : '下一项 →';
  }

  // 单价字段可跳过
  if (f.key === '单价') {
    document.getElementById('nextBtn').textContent =
      fromSummary ? '保存并返回 →' : '完成此条货物 →';
  }

  showPage('pageRecord');
  speakHint();
}

// ── TTS ───────────────────────────────────────────────────────────────
function speakHint() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const f = currentFields()[fieldIndex];
  const u = new SpeechSynthesisUtterance(f.hint);
  u.lang = 'zh-CN'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// ── 录音 ──────────────────────────────────────────────────────────────
async function toggleRecord() {
  isRecording ? stopRecord() : await startRecord();
}

async function startRecord() {
  try {
    const stream   = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks    = [];
    const mimeType = getSupportedMime();
    mediaRec = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRec.onstop = () => { stream.getTracks().forEach(t => t.stop()); uploadAudio(); };
    mediaRec.start();
    isRecording = true;
    document.getElementById('recBtn').className   = 'rec-btn recording';
    document.getElementById('recBtn').textContent = '⏹';
    document.getElementById('recStatus').textContent = '录音中… 点击停止';
    document.getElementById('recStatus').className   = 'rec-status active';
  } catch (err) {
    alert('无法访问麦克风：' + err.message + '\n请确保使用 HTTPS 访问。');
  }
}

function stopRecord() {
  if (mediaRec && isRecording) { mediaRec.stop(); isRecording = false; }
}

function getSupportedMime() {
  return ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}

async function uploadAudio() {
  const f    = currentFields()[fieldIndex];
  const mime = audioChunks[0]?.type || 'audio/webm';
  const ext  = mime.includes('ogg') ? 'ogg' : mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(audioChunks, { type: mime });
  const form = new FormData();
  form.append('audio', blob, `audio.${ext}`);
  form.append('language', 'zh');

  showLoading('识别中…');
  try {
    const resp = await fetch(`${API}/transcribe/${encodeURIComponent(f.key)}`, { method:'POST', body:form });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    document.getElementById('resultInput').value = data.text || '';
    document.getElementById('recBtn').textContent = '🎤';
    document.getElementById('recStatus').textContent = '识别完成，可修改后继续';
    document.getElementById('recStatus').className   = 'rec-status';
    renderSuggestions(data.suggestions || []);
  } catch (err) {
    alert('识别失败：' + err.message);
    document.getElementById('recBtn').textContent = '🎤';
    document.getElementById('recStatus').textContent = '识别失败，请重录';
    document.getElementById('recStatus').className   = 'rec-status';
  } finally { hideLoading(); }
}

// ── 候选词 ────────────────────────────────────────────────────────────
function renderSuggestions(list) {
  const box = document.getElementById('suggestions');
  if (!list.length) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<span class="suggest-label">💡 知识库匹配，点击使用：</span>' +
    list.map(s => `<span class="suggest-chip" onclick="applySuggestion('${s.text.replace(/'/g,"\\'")}')">${s.text}</span>`).join('');
}
function applySuggestion(text) {
  document.getElementById('resultInput').value = text;
  document.getElementById('suggestions').classList.add('hidden');
}

// ── 保存当前字段 ──────────────────────────────────────────────────────
function saveField() {
  const f   = currentFields()[fieldIndex];
  const val = document.getElementById('resultInput').value.trim();
  if (phase === 'header') {
    if (val) headerAnswers[f.key] = val;
  } else {
    if (val) currentItem[f.key] = val;
  }
}

// ── 导航 ──────────────────────────────────────────────────────────────
function goPrev() {
  saveField();
  if (fromSummary) {
    fromSummary = false;
    if (phase === 'header') showSummary();
    else showItemList();
    return;
  }
  if (fieldIndex > 0) {
    fieldIndex--;
    renderField();
  } else if (phase === 'item') {
    // 回到货物列表页
    showItemList();
  }
}

function goNext() {
  saveField();
  if (fromSummary) {
    fromSummary = false;
    if (phase === 'header') showSummary();
    else {
      // 保存编辑中的 item
      if (editingItem >= 0) itemList[editingItem] = { ...currentItem };
      else itemList.push({ ...currentItem });
      showItemList();
    }
    return;
  }

  if (fieldIndex < currentFields().length - 1) {
    fieldIndex++;
    renderField();
  } else {
    // 到达当前阶段最后一个字段
    if (phase === 'header') {
      startNewItem();
    } else {
      // 完成一条货物
      if (editingItem >= 0) itemList[editingItem] = { ...currentItem };
      else itemList.push({ ...currentItem });
      showItemList();
    }
  }
}

// ── 货物列表页 ────────────────────────────────────────────────────────
function showItemList() {
  editingItem = -1;
  renderItemListDisplay();
  document.getElementById('progressBar').style.width =
    `${(HEADER_FIELDS.length / (HEADER_FIELDS.length + itemList.length * ITEM_FIELDS.length)) * 80}%`;
  document.getElementById('stepLabel').textContent = `已添加 ${itemList.length} 条货物`;
  showPage('pageItemList');
}

function renderItemListDisplay() {
  const container = document.getElementById('itemListDisplay');
  if (itemList.length === 0) {
    container.innerHTML = '<div style="color:var(--gray);font-size:14px;padding:8px 0;">暂无货物，请添加</div>';
    return;
  }
  container.innerHTML = itemList.map((item, i) => {
    const title = [item.货物品牌, item.货物型号, item.货物品类].filter(Boolean).join(' ') || `第${i+1}条`;
    const spec  = item.货物规格 ? `（${item.货物规格}）` : '';
    const qty   = item.数量 || '';
    const price = item.单价 ? `单价 ${item.单价} 元` : '';
    const detail = [qty, price].filter(Boolean).join(' | ');
    return `
      <div class="item-card">
        <div class="item-card-actions">
          <button class="icon-btn" onclick="editItem(${i})" title="修改">✏️</button>
          <button class="icon-btn" onclick="deleteItem(${i})" title="删除">🗑️</button>
        </div>
        <div class="item-card-title">${i+1}. ${title}${spec}</div>
        ${detail ? `<div class="item-card-detail">${detail}</div>` : ''}
      </div>`;
  }).join('');
}

function editItem(i) {
  editingItem = i;
  currentItem = { ...itemList[i] };
  phase       = 'item';
  fieldIndex  = 0;
  renderField();
}

function deleteItem(i) {
  itemList.splice(i, 1);
  renderItemListDisplay();
  document.getElementById('stepLabel').textContent = `已添加 ${itemList.length} 条货物`;
}

// ── 汇总页 ────────────────────────────────────────────────────────────
function goToSummary() {
  if (itemList.length === 0) { alert('请至少添加一条货物'); return; }
  showSummary();
}

function showSummary() {
  // 甲方信息
  document.getElementById('summaryHeader').innerHTML =
    HEADER_FIELDS.map((f, i) => `
      <div class="field-row">
        <span class="key">${f.label}</span>
        <span class="value">${headerAnswers[f.key] || '<span style="color:#bbb">未填写</span>'}</span>
        <span class="edit-link" onclick="editHeaderField(${i})">修改</span>
      </div>`).join('');

  // 货物清单
  document.getElementById('summaryItems').innerHTML = itemList.map((item, i) => {
    const title = [item.货物品牌, item.货物型号, item.货物品类].filter(Boolean).join(' ') || `第${i+1}条`;
    const rows = ITEM_FIELDS.filter(f => f.key !== '货物品牌' && f.key !== '货物型号' && f.key !== '货物品类')
      .map(f => `
        <div class="field-row">
          <span class="key">${f.label}</span>
          <span class="value">${item[f.key] || '<span style="color:#bbb">—</span>'}</span>
        </div>`).join('');
    return `
      <div style="border:1px solid #f0f0f0;border-radius:8px;padding:10px 12px;margin-bottom:10px;">
        <div style="font-weight:600;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;">
          <span>${i+1}. ${title}</span>
          <span class="edit-link" onclick="editItem(${i});fromSummary=true;">修改</span>
        </div>
        ${rows}
      </div>`;
  }).join('');

  document.getElementById('progressBar').style.width = '95%';
  document.getElementById('stepLabel').textContent   = '确认信息';
  showPage('pageSummary');
}

function editHeaderField(i) {
  fromSummary = true;
  phase       = 'header';
  fieldIndex  = i;
  renderField();
}

// ── 生成合同 ──────────────────────────────────────────────────────────
async function doGenerate() {
  showLoading('生成合同中…');
  try {
    const resp = await fetch(`${API}/generate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': '1',
      },
      body: JSON.stringify({ contract_type: '采购合同', voice_data: headerAnswers, items: itemList }),
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || resp.statusText); }
    // 生成时直接把文件拉回来存为 blob，按钮点击时无需再请求
    const cd    = resp.headers.get('Content-Disposition') || '';
    const match = cd.match(/filename\*=UTF-8''(.+)/);
    lastFilename = match ? decodeURIComponent(match[1]) : '采购合同.docx';
    lastBlob = await resp.blob();

    // 调试信息
    const blobUrl = URL.createObjectURL(lastBlob);
    document.getElementById('debugInfo').innerHTML =
      `<b>调试信息</b><br>` +
      `文件名：${lastFilename}<br>` +
      `大小：${(lastBlob.size / 1024).toFixed(1)} KB<br>` +
      `类型：${lastBlob.type}<br>` +
      `Share API：${!!navigator.share} / canShare：${!!(navigator.canShare)}<br>` +
      `Blob 直链：<a href="${blobUrl}" style="color:#1677ff">${blobUrl.substring(0,60)}…</a>`;

    document.getElementById('successFilename').textContent = lastFilename;
    document.getElementById('progressBar').style.width    = '100%';
    document.getElementById('stepLabel').textContent      = '完成';
    showPage('pageSuccess');
  } catch (err) {
    alert('生成失败：' + err.message);
  } finally { hideLoading(); }
}

// ── 下载合同 ──────────────────────────────────────────────────────────
async function triggerDownload() {
  if (!lastBlob) { alert('请先生成合同'); return; }

  const file = new File([lastBlob], lastFilename, {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  });

  // Android Chrome：优先用 Web Share API（原生分享/保存面板）
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: lastFilename });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // 用户取消，不报错
    }
  }

  // PC / 不支持 Share API 的浏览器：传统 blob 下载
  const url = URL.createObjectURL(file);
  const a   = document.createElement('a');
  a.href = url; a.download = lastFilename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 2000);
}

// ── 重置 ──────────────────────────────────────────────────────────────
function restart() {
  headerAnswers = {}; itemList = []; currentItem = {};
  phase = 'header'; fieldIndex = 0; fromSummary = false; editingItem = -1;
  startHeader();
}

// ── 工具 ──────────────────────────────────────────────────────────────
function showPage(id) {
  ['pageRecord','pageItemList','pageSummary','pageSuccess'].forEach(p =>
    document.getElementById(p).classList.toggle('hidden', p !== id));
}
function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

init();
</script>
